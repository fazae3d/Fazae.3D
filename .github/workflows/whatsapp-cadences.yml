name: Cadências WhatsApp

# A Vercel gratuita só roda tarefas 1 vez por dia. Aqui o GitHub chama o site a cada ~10 minutos para o envio automático andar.
# Precisa do segredo CRON_SECRET em Settings > Secrets and variables > Actions (o mesmo valor da Vercel). Sem ele, não faz nada.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Rodar cadências
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET não configurado: nada a fazer"; exit 0; fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" https://www.fazae3d.com.br/api/cron/whatsapp-cadences
